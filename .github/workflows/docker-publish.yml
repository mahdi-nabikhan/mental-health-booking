
name: Backend Docker Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          touch .env
          echo "POSTGRES_DB=ci_test" >> .env
          echo "POSTGRES_USER=ci_test" >> .env
          echo "POSTGRES_PASSWORD=ci_test_password" >> .env

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Build Backend Image
        run: docker build -f Dockerfile.backend -t mental-health-backend:latest .
