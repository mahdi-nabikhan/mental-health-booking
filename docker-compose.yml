services:

  web:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: mental_health_web

    command: gunicorn src.config.wsgi:application --bind 0.0.0.0:8000 --workers 3

    volumes:
      - .:/app

    expose:
      - "8000"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started


  nginx:
    image: nginx:alpine

    container_name: mental_health_nginx

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - web


  db:
    image: postgres:17

    container_name: mental_health_db

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine

    container_name: mental_health_redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes


volumes:
  postgres_data:
  redis_data: