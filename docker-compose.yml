services:

  web:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: mental_health_web

    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3

    restart: unless-stopped

    expose:
      - "8000"

    volumes:
      - staticfiles:/app/staticfiles

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started


  nginx:
    image: docker.novin.cloud/library/nginx:alpine

    container_name: mental_health_nginx

    restart: unless-stopped

    ports:
      - "8888:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
      - ./src/frontend/dist:/usr/share/nginx/html:ro

    depends_on:
      - web


  db:
    image: docker.novin.cloud/library/postgres:17

    container_name: mental_health_db

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: docker.novin.cloud/library/redis:7-alpine

    container_name: mental_health_redis

    restart: unless-stopped

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes


volumes:
  postgres_data:
  redis_data:
  staticfiles:
